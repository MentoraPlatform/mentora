# MentoraOS — CI Foundation (R5 Phase 2, Lot 1)
#
# LA LOI DE CE WORKFLOW : la CI applique les Foundations, elle ne les
# remplace jamais (CI/CD Strategy, Lot 5). Elle exécute EXACTEMENT la
# commande du développeur — `pnpm verify` — rien d'autre, jamais
# recomposée à la main. Aucune logique métier, aucun comportement
# spécial CI (preset gelé « CI-identique »).
#
# Actions : OFFICIELLES uniquement (actions/*), épinglées par SHA
# (gouvernance supply-chain, Lot 5 §6). pnpm arrive par corepack
# (champ packageManager du repo) : zéro action tierce.
#
# La base PostgreSQL est un service container ÉPHÉMÈRE : née pour le
# run, données de spec uniquement (S-9), morte avec le runner. Ses
# identifiants ne protègent rien (réseau local du runner) — ce ne sont
# pas des secrets, c'est la configuration d'une infrastructure jetable.

name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - release
      - "release/**"
      - arch-008-candidate # la branche Genesis reçoit des lots ordonnés : ils sont vérifiés aussi

permissions:
  contents: read # moindre privilège — la CI lit, ne touche à rien

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # un nouveau push rend l'ancien run obsolète

jobs:
  verify:
    # LE check publié — les Rulesets (Lot 3) exigeront « verify » :
    # la gate est UNE (typecheck+lint+test+build via turbo), la
    # décomposer en checks séparés serait la recomposer à la main.
    name: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    services:
      postgres:
        # Parité avec l'infra de dev (pgvector/pg16, conteneur jetable) ;
        # btree_gist (clé R-A) vient du contrib PostgreSQL standard.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mentora
          POSTGRES_PASSWORD: mentora-ci-ephemeral
          POSTGRES_DB: mentora_agreement_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mentora -d mentora_agreement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Le nom du schéma déclaré I-5 (gelé) ; turbo la laisse passer
      # (globalPassThroughEnv). Les tests d'intégration s'activent
      # par sa présence — exactement comme sur le poste de dev.
      MENTORA_AGREEMENT_DATABASE_URL: postgresql://mentora:mentora-ci-ephemeral@localhost:5432/mentora_agreement_test
      MENTORA_IDENTITY_DATABASE_URL: postgresql://mentora:mentora-ci-ephemeral@localhost:5432/mentora_identity_test
      MENTORA_ACCOUNT_DATABASE_URL: postgresql://mentora:mentora-ci-ephemeral@localhost:5432/mentora_account_test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node (version du repo — .nvmrc fait foi)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: platform/.nvmrc

      - name: Setup pnpm (corepack épinglé — la version de pnpm vient toujours du champ packageManager)
        # Le corepack embarqué varie avec la version de Node et les plus
        # anciens (≤0.29) ne portent que l'ANCIENNE clé de signature du
        # registre npm (tournée en janvier 2025) — symptôme : « Cannot
        # find matching keyid ». On épingle corepack 0.31.0 (première
        # version portant les clés tournées) : DÉTERMINISTE quel que soit
        # le corepack embarqué, la vérification de signature reste active
        # (jamais désactivée), et packageManager reste l'unique source de
        # vérité de la version de pnpm.
        run: |
          npm install -g corepack@0.31.0
          corepack enable

      - name: pnpm store cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          # Cache du STORE pnpm seulement (immuable, adressé par contenu).
          # JAMAIS cachés : node_modules, le cache turbo (chaque run CI
          # est froid — la preuve ne se recycle pas), l'état de la base,
          # les résultats de tests. Invalidation : le lockfile.
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('platform/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install (lockfile gelé — la CI n'invente pas de résolutions)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (le client naît dans le paquet adapters — hoist=false)
        run: pnpm --filter @mentora/adapters-persistence-agreement prisma:generate

      - name: Prisma migrate deploy (les migrations gelées, dans l'ordre, sur la base neuve)
        run: pnpm --filter @mentora/adapters-persistence-agreement exec prisma migrate deploy
      - name: Base identity (même serveur, seconde base — parité dev)
        run: |
          PGPASSWORD=mentora-ci-ephemeral psql -h localhost -U mentora -d mentora_agreement_test -tc "SELECT 1 FROM pg_database WHERE datname='mentora_identity_test'" | grep -q 1 || PGPASSWORD=mentora-ci-ephemeral psql -h localhost -U mentora -d mentora_agreement_test -c 'CREATE DATABASE mentora_identity_test'
      - name: Prisma migrate deploy identity (les migrations gelées, base identity)
        run: pnpm --filter @mentora/adapters-persistence-identity exec prisma migrate deploy
      - name: Base account (même serveur, troisième base — parité dev)
        run: |
          PGPASSWORD=mentora-ci-ephemeral psql -h localhost -U mentora -d mentora_agreement_test -tc "SELECT 1 FROM pg_database WHERE datname='mentora_account_test'" | grep -q 1 || PGPASSWORD=mentora-ci-ephemeral psql -h localhost -U mentora -d mentora_agreement_test -c 'CREATE DATABASE mentora_account_test'
      - name: Prisma migrate deploy account (les migrations gelées, base account)
        run: pnpm --filter @mentora/adapters-persistence-account exec prisma migrate deploy

      - name: Verify — LA gate, exactement la commande du développeur
        run: pnpm verify
