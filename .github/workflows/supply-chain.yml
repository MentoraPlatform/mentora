# MentoraOS — Supply Chain Report (R5 Phase 2, Lot 5)
#
# L'inventaire hebdomadaire prouvé de la chaîne d'approvisionnement :
# composants épinglés/non épinglés, versions critiques, mises à jour
# disponibles, niveau de risque. Il ne met RIEN à jour — il gouverne par
# la preuve. Outil premier-parti zéro dépendance
# (.github/scripts/supply-chain-audit.mjs) — le même en local et en CI.
# Loi bloquante unique : une action GitHub non épinglée par SHA = FAIL.

name: supply-chain

on:
  schedule:
    - cron: "30 6 * * 1" # lundi 06:30 UTC — après le train Dependabot de 06:00
  workflow_dispatch: {}
  pull_request:
    paths:
      - "platform/pnpm-lock.yaml"
      - "platform/pnpm-workspace.yaml"
      - "platform/package.json"
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-audit:
    name: supply-chain-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node (version du repo — .nvmrc fait foi)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: platform/.nvmrc

      - name: Setup pnpm (corepack épinglé — nécessaire à pnpm outdated)
        run: |
          npm install -g corepack@0.31.0
          corepack enable

      - name: Mises à jour disponibles (informatif — pnpm outdated depuis le lockfile)
        working-directory: platform
        run: |
          pnpm outdated --format json > ../outdated.json || true
          echo "outdated collecté ($(wc -c < ../outdated.json) octets)"

      - name: Audit supply-chain (épinglages, versions, risque)
        run: node .github/scripts/supply-chain-audit.mjs .

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-report
          path: supply-chain-report.json
          if-no-files-found: error
          retention-days: 90
